name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: romantika_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d romantika_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/romantika_test
      MEDIA_DIR: /tmp/media
    steps:
      - uses: actions/checkout@v4
      - name: System packages (WeasyPrint, pg_dump 16, rsync, fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 libffi8 libcairo2 \
            libgdk-pixbuf-2.0-0 shared-mime-info fonts-dejavu-core rsync postgresql-client-16
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.13"
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy romantika
      - run: uv run pytest -q -p no:cacheprovider
