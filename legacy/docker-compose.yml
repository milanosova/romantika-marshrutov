# Бот клуба «Романтика маршрутов». Один сервис, портов наружу нет:
# бот сам стучится в Телеграм long-polling'ом, входящие соединения ему
# не нужны.
services:
  бот:
    build: ./бот
    container_name: romantika-бот
    restart: unless-stopped

    env_file: .env            # TOKEN и ADMIN_ID, в git не попадает

    # Телеграм из РФ-ЦОДа напрямую не ходит — только через прокси хоста
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HTTP_PROXY: http://host.docker.internal:10809
      HTTPS_PROXY: http://host.docker.internal:10809
      NO_PROXY: localhost,127.0.0.1,host.docker.internal

    volumes:
      - ./данные:/данные      # участники, отчёты, штампы, ачивки, факты

    cpus: 1.0
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
